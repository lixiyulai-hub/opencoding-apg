name: Neutral candidate Windows validation

on:
  push:
    branches: [validation/windows-neutral-20261006]

permissions:
  contents: read

jobs:
  candidate:
    name: Pinned candidate / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.symlinks
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - name: Check out validation tools at the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation-tools
          persist-credentials: false
      - name: Check out the exact product candidate
        uses: actions/checkout@v4
        with:
          ref: 6c91c76da7af87854db3b7885c2d7b64fc42e7c0
          path: candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the declared build backend
        run: python -m pip install --upgrade "setuptools>=83"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare the source-bound temporary summary context
        id: context
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $failureStep = 'prepare_context'
          $failureStage = 'pinned_candidate_Q'
          $failureLog = Join-Path $env:RUNNER_TEMP 'neutral-candidate-context.log'
          function Write-PublicFailure([string]$Category, [int]$ExitCode, [string]$LogPath) {
            $digest = $null
            if (Test-Path -LiteralPath $LogPath -PathType Leaf) { $digest = (Get-FileHash -LiteralPath $LogPath -Algorithm SHA256).Hash.ToLower() }
            [ordered]@{schema_version=1; kind='public_summary_failure'; workflow_scope='pinned_candidate_Q'; status='incomplete'; stage=$failureStage; step=$failureStep; error_category=$Category; exit_code=$ExitCode; log_sha256=$digest} | ConvertTo-Json -Compress
          }
          try {
            $python = (Get-Command python -CommandType Application).Source
            $tools = Join-Path $env:GITHUB_WORKSPACE 'validation-tools/.validation/neutral-20261006'
            $context = Join-Path $env:RUNNER_TEMP 'neutral-candidate-context.json'
            $digest = @(& $python -B -X utf8 (Join-Path $tools 'prepare_context.py') --checkout (Join-Path $env:GITHUB_WORKSPACE 'validation-tools') --binding (Join-Path $tools 'candidate-binding.json') --binding-sha256 'db7f6a52d9aee51882cec533ec46c79c479472e85d627a6f7ee07533930a2480' --python-version '${{ matrix.python-version }}' --output $context 2>&1)
            $prepareExit = $LASTEXITCODE
            $digest | Out-File -LiteralPath $failureLog -Encoding utf8
            if ($prepareExit -ne 0 -or $digest.Count -ne 1 -or "$($digest[0])" -notmatch '^[0-9a-f]{64}$') {
              $category = if ($prepareExit -ne 0) { 'tool_exit_nonzero' } else { 'output_rejected' }
              Write-Output (Write-PublicFailure $category $(if ($prepareExit -ne 0) { $prepareExit } else { 1 }) $failureLog)
              exit $(if ($prepareExit -ne 0) { $prepareExit } else { 1 })
            }
            "context_sha256=$($digest[0])" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Output (Write-PublicFailure 'powershell_exception' 1 $failureLog)
            exit 1
          }
      - name: Verify candidate identity and execute Windows checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $runnerExit = $null
          $failureStep = 'run_windows_validation'
          $failureStage = 'pinned_candidate_Q'
          $failureLog = Join-Path $env:RUNNER_TEMP 'neutral-candidate-runner-errors.log'
          function Write-PublicFailure([string]$Category, [int]$ExitCode, [string]$LogPath) {
            $digest = $null
            if (Test-Path -LiteralPath $LogPath -PathType Leaf) { $digest = (Get-FileHash -LiteralPath $LogPath -Algorithm SHA256).Hash.ToLower() }
            [ordered]@{schema_version=1; kind='public_summary_failure'; workflow_scope='pinned_candidate_Q'; status='incomplete'; stage=$failureStage; step=$failureStep; error_category=$Category; exit_code=$ExitCode; log_sha256=$digest} | ConvertTo-Json -Compress
          }
          try {
            & ./validation-tools/.validation/neutral-20261006/run_windows_validation.ps1 `
              -Repository (Join-Path $env:GITHUB_WORKSPACE 'candidate') `
              -PythonVersion '${{ matrix.python-version }}' `
              -PythonExecutable (Get-Command python).Source `
              -BindingSha256 'db7f6a52d9aee51882cec533ec46c79c479472e85d627a6f7ee07533930a2480' `
              -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'neutral-candidate-evidence') 2> (Join-Path $env:RUNNER_TEMP 'neutral-candidate-runner-errors.log')
            $runnerExit = $LASTEXITCODE
            exit $runnerExit
          } catch {
            $code = if ($null -ne $runnerExit -and $runnerExit -ne 0) { $runnerExit } else { 1 }
            Write-Output (Write-PublicFailure 'powershell_exception' $code $failureLog)
            if ($null -ne $runnerExit -and $runnerExit -ne 0) { exit $runnerExit }
            exit 1
          }
      - name: Publish only the validated public summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $failureStep = 'summarize_pinned'
          $failureStage = 'pinned_candidate_Q'
          $failureLog = Join-Path $env:RUNNER_TEMP 'neutral-candidate-summary-errors.log'
          function Write-PublicFailure([string]$Category, [int]$ExitCode, [string]$LogPath) {
            $digest = $null
            if (Test-Path -LiteralPath $LogPath -PathType Leaf) { $digest = (Get-FileHash -LiteralPath $LogPath -Algorithm SHA256).Hash.ToLower() }
            [ordered]@{schema_version=1; kind='public_summary_failure'; workflow_scope='pinned_candidate_Q'; status='incomplete'; stage=$failureStage; step=$failureStep; error_category=$Category; exit_code=$ExitCode; log_sha256=$digest} | ConvertTo-Json -Compress
          }
          try {
            $digest = '${{ steps.context.outputs.context_sha256 }}'
            if ($digest -notmatch '^[0-9a-f]{64}$') { throw 'validation_unavailable' }
            $python = (Get-Command python -CommandType Application).Source
            $tools = Join-Path $env:GITHUB_WORKSPACE 'validation-tools/.validation/neutral-20261006'
            $evidence = Join-Path $env:RUNNER_TEMP 'neutral-candidate-evidence'
            $ErrorActionPreference = 'Continue'
            & $python -B -X utf8 (Join-Path $tools 'summarize_pinned.py') --context (Join-Path $env:RUNNER_TEMP 'neutral-candidate-context.json') --context-sha256 $digest --result (Join-Path $evidence 'result.json') --source-before (Join-Path $evidence 'source-before.log') --source-after (Join-Path $evidence 'source-after.log') 2> (Join-Path $env:RUNNER_TEMP 'neutral-candidate-summary-errors.log')
            exit $LASTEXITCODE
          } catch {
            Write-Output (Write-PublicFailure 'powershell_exception' 1 $failureLog)
            exit 1
          }
