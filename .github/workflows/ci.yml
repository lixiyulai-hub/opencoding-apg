name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-windows:
    name: Python ${{ matrix.python-version }} (Windows full suite)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the declared build backend
        run: python -m pip install --upgrade "setuptools>=83"
      - name: Set up Rust for the domain contract test
        uses: dtolnay/rust-toolchain@stable
      # The zero-write scheduler snapshot contract is Windows-specific because
      # it uses the Windows shared-byte locking primitive.
      - name: Run the repository unittest entry point
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/validation/windows-neutral-20261006') }}
        run: python -X utf8 -m unittest
      - name: Capture the neutral validation branch full suite
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/validation/windows-neutral-20261006' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $wrapperExit = $null
          $failureStep = 'bootstrap_tools'
          $failureStage = 'windows_validation'
          $failureLog = Join-Path $env:RUNNER_TEMP 'neutral-full-wrapper-errors.log'
          $failureOutput = Join-Path $env:RUNNER_TEMP 'neutral-full-wrapper-output.log'
          function Write-PublicFailure([string]$Category, [int]$ExitCode, [string]$LogPath) {
            $digest = $null
            if (Test-Path -LiteralPath $LogPath -PathType Leaf) {
              $digest = (Get-FileHash -LiteralPath $LogPath -Algorithm SHA256).Hash.ToLower()
            }
            [ordered]@{
              schema_version = 1
              kind = 'public_summary_failure'
              workflow_scope = 'existing_ci_full_W'
              status = 'incomplete'
              stage = $failureStage
              step = $failureStep
              error_category = $Category
              exit_code = $ExitCode
              log_sha256 = $digest
            } | ConvertTo-Json -Compress
          }
          try {
            $python = (Get-Command python -CommandType Application).Source
            # Extract exact reviewed Git bytes without changing this source checkout.
            $bootstrap = @'
          import os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          head = subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'], stderr=subprocess.PIPE).decode().strip()
          if not re.fullmatch('[0-9a-f]{40}',head) or head != os.environ.get('GITHUB_SHA'):
              raise SystemExit(1)
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'neutral-full-tools'
          folder.mkdir()
          names = ('candidate-binding.json','source-files.json','verify_source.py','run_windows_validation.ps1','public_output.py','capture_unittest.py','summarize_pinned.py','prepare_context.py')
          for name in names:
              data = subprocess.check_output(['git','-C',str(root),'show',head+':.validation/neutral-20261006/'+name], stderr=subprocess.PIPE)
              (folder/name).write_bytes(data)
            '@
            $bootstrapOutput = @(& $python -B -X utf8 -c $bootstrap 2>&1)
            $bootstrapExit = $LASTEXITCODE
            $bootstrapOutput | Out-File -LiteralPath $failureLog -Encoding utf8
            if ($bootstrapExit -ne 0) {
              Write-Output (Write-PublicFailure 'tool_exit_nonzero' $bootstrapExit $failureLog)
              exit $bootstrapExit
            }
            $tools = Join-Path $env:RUNNER_TEMP 'neutral-full-tools'
            $context = Join-Path $env:RUNNER_TEMP 'neutral-full-context.json'
            $contextLog = Join-Path $env:RUNNER_TEMP 'neutral-full-context.log'
            $failureStep = 'prepare_context'
            $contextDigest = @(& $python -B -X utf8 (Join-Path $tools 'prepare_context.py') --checkout $env:GITHUB_WORKSPACE --binding (Join-Path $tools 'candidate-binding.json') --binding-sha256 'db7f6a52d9aee51882cec533ec46c79c479472e85d627a6f7ee07533930a2480' --python-version '${{ matrix.python-version }}' --output $context 2>&1)
            $contextExit = $LASTEXITCODE
            $contextDigest | Out-File -LiteralPath $contextLog -Encoding utf8
            if ($contextExit -ne 0 -or $contextDigest.Count -ne 1 -or "$($contextDigest[0])" -notmatch '^[0-9a-f]{64}$') {
              $category = if ($contextExit -ne 0) { 'tool_exit_nonzero' } else { 'output_rejected' }
              Write-Output (Write-PublicFailure $category $(if ($contextExit -ne 0) { $contextExit } else { 1 }) $contextLog)
              exit $(if ($contextExit -ne 0) { $contextExit } else { 1 })
            }
            $ErrorActionPreference = 'Continue'
            $failureStep = 'capture_unittest'
            & $python -B -X utf8 (Join-Path $tools 'capture_unittest.py') --context $context --context-sha256 "$($contextDigest[0])" --log-directory (Join-Path $env:RUNNER_TEMP 'neutral-full-evidence') 1> $failureOutput 2> $failureLog
            $wrapperExit = $LASTEXITCODE
            $summary = if (Test-Path -LiteralPath $failureOutput -PathType Leaf) { Get-Content -LiteralPath $failureOutput -Raw } else { '' }
            try { $parsed = $summary | ConvertFrom-Json -ErrorAction Stop } catch { $parsed = $null }
            if ($null -ne $parsed -and $parsed.kind -eq 'public_windows_validation_summary') {
              Write-Output $summary.TrimEnd()
              exit $wrapperExit
            }
            Write-Output (Write-PublicFailure $(if ($wrapperExit -ne 0) { 'wrapper_or_child_failure' } else { 'summary_rejected' }) $(if ($wrapperExit -ne 0) { $wrapperExit } else { 1 }) $failureLog)
            exit $(if ($wrapperExit -ne 0) { $wrapperExit } else { 1 })
          } catch {
            $code = if ($null -ne $wrapperExit -and $wrapperExit -ne 0) { $wrapperExit } else { 1 }
            Write-Output (Write-PublicFailure 'powershell_exception' $code $failureLog)
            if ($null -ne $wrapperExit -and $wrapperExit -ne 0) { exit $wrapperExit }
            exit 1
          }
      - name: Run the packaging contract directly
        run: python -X utf8 -m unittest tests.test_product_packaging

  package-static:
    name: Package and static checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the declared build backend
        run: python -m pip install --upgrade "setuptools>=83"
      - name: Compile Python sources
        run: python -X utf8 -m compileall -q opencoding scripts tests
      - name: Run the packaging contract
        run: python -X utf8 -m unittest tests.test_product_packaging
      - name: Build sdist and wheel through the declared backend
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import setuptools.build_meta as backend

          output = pathlib.Path("dist")
          output.mkdir(exist_ok=True)
          print(backend.build_sdist(str(output)))
          print(backend.build_wheel(str(output)))
          PY

  rust:
    name: Rust domain tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run domain tests
        run: cargo test --manifest-path services/domain/Cargo.toml
